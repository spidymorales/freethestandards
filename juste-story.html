  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  function unlock(pw, remember) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"])
      .then(function (k) { return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: 310000, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })
      .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data)); })
      .then(function (buf) {
        if (remember) { try { sessionStorage.setItem("fts-pw", pw); } catch (e) {} }
        var html = new TextDecoder().decode(buf);
        document.open(); document.write(html); document.close();
        if (location.hash) setTimeout(function () { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }, 300);
      });
  }
  var saved = null; try { saved = sessionStorage.getItem("fts-pw"); } catch (e) {}
  if (saved) unlock(saved, false).catch(function () { try { sessionStorage.removeItem("fts-pw"); } catch (e) {} });
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var pw = document.getElementById("pw").value;
    document.getElementById("err").textContent = "";
    unlock(pw, true).catch(function () { document.getElementById("err").textContent = "That password didn't work."; });
  });
})();
